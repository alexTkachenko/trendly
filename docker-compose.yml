name: trendly

# Local development stack for Trendly: Postgres + Spring Boot backend +
# Next.js frontend, all reachable from each other by service name on the
# shared `trendly_net` network.
#
# Usage: cp .env.example .env && docker compose up
# See docs/local-dev.md for full details.
#
# NOTE: as of OPS-1.2/OPS-1.3, backend/Dockerfile and frontend/Dockerfile are
# real multi-stage builds (Maven -> JRE, and npm ci -> next build -> Next.js
# standalone runtime -- see tasks/devops/OPS-1.2.md and OPS-1.3.md), but both
# still build minimal placeholder apps (backend/pom.xml + backend/src/;
# frontend/package.json + frontend/app/) since BE-1.1 and FE-1.1 (the real
# Spring Boot / Next.js apps) haven't landed yet. This file itself should not
# need to change when those placeholders are replaced, with one exception
# already accounted for below: frontend.build.args.NEXT_PUBLIC_API_BASE_URL
# passes the var as a Docker build ARG (not a runtime `environment:` var),
# because Next.js inlines NEXT_PUBLIC_* at build time -- this is required for
# FE-1.1's real app and is already wired correctly here.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trendly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - trendly_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - trendly_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      # 127.0.0.1, not localhost: the Next.js standalone server binds only
      # to IPv4 (0.0.0.0:3000); `localhost` resolves to ::1 first inside
      # the alpine container and wget's IPv6 attempt fails with
      # "Connection refused" even though the app is healthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - trendly_net

volumes:
  trendly_pgdata:
    name: trendly_pgdata

networks:
  trendly_net:
    name: trendly_net
